<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Ссылка ходит между товарищами: искать сайт поисковикам незачем. -->
<meta name="robots" content="noindex, nofollow">
<!-- Тема одна, светлая, как у «Лучезарности» и 11-1: «only light» —
     чтобы Chrome на Android с тёмным режимом не перекрашивал страницу. -->
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#FFFFFF">
<title>ВсОШ по ИИ</title>
<!-- Логотип «Вензель» (23.10.2026): две «И» слиты в одну лигатуру —
     три тонких штамба и две толстые диагонали, засечки волосяные,
     контраст наборной антиквы. Вторая диагональ фиолетовая #7A45D1.
     Плашка белая в чёрной обводке, как блоки «Бумаги». Не похож
     ни на знак «Лучезарности» (лучи на чёрном круге), ни на «Петли»
     11-1 (одна непрерывная линия): буквы, квадрат, без золота.
     Сменил «Ошибку» (21.10.2026, точки и прямая классификатора):
     владелец хотел другую манеру, не плоский значок в два цвета.
     Выбран из четырёх: «Орден», «Ворон», «Вензель», «Журавлик».
     Значок вкладки — тот же рисунок, но штамбы и обводка толще:
     в 16 точках тонкие пропадают. Плашка белая, поэтому и на тёмной
     вкладке он виден без перекраски. ?v= у значков — чтобы браузер
     не держал прежний из кэша. -->
<link rel="icon" href="assets/favicon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="assets/fonts/golos-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/style.css?v=8">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <!-- Оба логотипа — кнопки, а не ссылки, как на 11-1: нажатие
         страницу не перезагружает, а только запускает анимацию.
         Рисунки встроены в разметку: приходят вместе со страницей
         и не мигают пустым местом. -->
    <button class="logo venzel-btn" type="button" aria-label="ВсОШ по ИИ">
      <!-- Тот же рисунок, что assets/logo.svg. Поле обрезано по плашке
           с её обводкой (5–95): в квадрате 0–100 логотип выходил бы мельче
           знака и отодвинутым от края. Сверх файла — бледная дорожка
           под фиолетовой диагональю и clipPath уровня: для анимации. -->
      <svg class="brand-logo venzel" viewBox="5 5 90 90" aria-hidden="true" focusable="false">
        <defs><clipPath id="venzel-zaliv"><rect class="venzel-uroven" x="40" y="25" width="45" height="50"/></clipPath></defs>
        <rect x="7" y="7" width="86" height="86" rx="16" fill="#fff" stroke="#141118" stroke-width="3.2"/>
        <g fill="#141118">
          <rect x="21.5" y="27" width="5" height="46"/>
          <rect x="47.5" y="27" width="5" height="46"/>
          <rect x="73.5" y="27" width="5" height="46"/>
          <rect x="17.5" y="27" width="13" height="2.6"/>
          <rect x="17.5" y="70.4" width="13" height="2.6"/>
          <rect x="43.5" y="27" width="13" height="2.6"/>
          <rect x="43.5" y="70.4" width="13" height="2.6"/>
          <rect x="69.5" y="27" width="13" height="2.6"/>
          <rect x="69.5" y="70.4" width="13" height="2.6"/>
          <polygon points="21.5,73 36,73 52.5,27 38,27"/>
        </g>
        <polygon class="venzel-dorozhka" points="47.5,73 62,73 78.5,27 64,27" fill="#EBE3F8"/>
        <polygon points="47.5,73 62,73 78.5,27 64,27" fill="#7A45D1" clip-path="url(#venzel-zaliv)"/>
      </svg>
    </button>
    <!-- Надписи рядом с логотипами нет, как на 11-1; до логотипа здесь
         стояло название словами. Заголовок остаётся для читалки экрана. -->
    <h1 class="sr-only">ВсОШ по ИИ — задачи, теория и проверка к ним</h1>
    <!-- Знак «Лучезарности» — справа, как на 11-1: он стоит на всём,
         что делает владелец. Нажатие — вспышка лучей, страница
         не перезагружается. -->
    <button class="logo znak-btn" type="button" aria-label="Лучезарность">
      <svg class="brand-logo znak" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
        <circle cx="50" cy="50" r="50" fill="#000"/>
        <g class="znak-rays" stroke="#FDD17A" stroke-width="2.6">
          <line x1="50.0" y1="57.0" x2="50.0" y2="90.0"/>
          <line x1="56.1" y1="53.5" x2="84.6" y2="70.0"/>
          <line x1="57.0" y1="50.0" x2="80.0" y2="50.0"/>
          <line x1="56.1" y1="46.5" x2="84.6" y2="30.0"/>
          <line x1="53.5" y1="43.9" x2="65.0" y2="24.0"/>
          <line x1="50.0" y1="43.0" x2="50.0" y2="10.0"/>
          <line x1="46.5" y1="43.9" x2="35.0" y2="24.0"/>
          <line x1="43.9" y1="46.5" x2="15.4" y2="30.0"/>
          <line x1="43.0" y1="50.0" x2="20.0" y2="50.0"/>
          <line x1="43.9" y1="53.5" x2="15.4" y2="70.0"/>
        </g>
        <polygon points="50.0,50.0 61.5,76.3 73.0,89.8 67.0,73.1" fill="#fff"/>
        <polygon points="50.0,50.0 33.0,73.1 27.0,89.8 38.5,76.3" fill="#fff"/>
        <circle cx="50" cy="50" r="4.5" fill="#fff"/>
      </svg>
    </button>
  </header>

  <!-- Каркас виден, пока скрипт ходит за индексом. -->
  <main id="main">
    <div class="skeleton" aria-hidden="true">
      <span class="skel-head"></span>
      <span class="skel-row"></span>
      <span class="skel-row"></span>
    </div>
  </main>
</div>
<!-- marked — разбор markdown для инструкции по проверке: она пишется
     одним файлом, README.md в архиве, и на странице показывается он же,
     а не копия. Та же версия, что на «Лучезарности». Не загрузится —
     инструкция покажется простым текстом. -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script defer src="assets/app.js?v=3"></script>
</body>
</html>
